name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          rsync -r \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='*.md' \
            --exclude='node_modules/' \
            --exclude='*.zip' \
            . /tmp/build/woocommerce-irembopay/

          cd /tmp/build
          zip -r "$GITHUB_WORKSPACE/woocommerce-irembopay.zip" woocommerce-irembopay/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: woocommerce-irembopay.zip
